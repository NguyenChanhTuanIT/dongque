<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xuất kid.glb</title>
    <style>
      body { margin: 0; padding: 24px; font: 16px/1.5 system-ui, sans-serif; background: #fffdf8; color: #4d4945; }
      button { padding: 8px 16px; font: inherit; border: 0; border-radius: 6px; background: #716c66; color: #f9efdc; cursor: pointer; }
    </style>
  </head>
  <body>
    <h1>Xuất nhân vật sang .glb</h1>
    <p>Gộp kid.bin, kid-bones.bin và các animation thành một file kid.glb (mở được trong Blender).</p>
    <button id="go" type="button">Tải kid.glb</button>
    <p id="status"></p>
    <script type="module">
      import { downloadKidGlb, exportKidGlb } from './export-kid-glb.ts';
      window.exportKidGlb = exportKidGlb; // for scripted exports
      const status = document.getElementById('status');
      document.getElementById('go').addEventListener('click', async () => {
        status.textContent = 'Đang xuất…';
        try {
          const bytes = await downloadKidGlb();
          status.textContent = `Xong: ${(bytes / 1024).toFixed(0)} KB.`;
        } catch (err) {
          status.textContent = `Lỗi: ${err}`;
          console.error(err);
        }
      });
    </script>
  </body>
</html>
